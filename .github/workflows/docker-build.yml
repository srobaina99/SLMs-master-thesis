name: Build and push ClusterUY Docker image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Docker image tag (e.g. v2-p100, v3, test)"
        required: true
        default: "v2-p100"
  push:
    branches: [feature/refactor, mac-backup]
    paths:
      - "Tesis/Codigo/scripts/clusteruy/Dockerfile"
      - ".github/workflows/docker-build.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Free disk: ubuntu-latest runners ship with ~14 GB free, but preinstalled
      # Android / .NET / Haskell / CodeQL tooling wastes ~30 GB we can reclaim.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
            "$AGENT_TOOLSDIRECTORY" || true
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Resolve tag
        id: tag
        run: echo "tag=${{ github.event.inputs.tag || 'v2-p100' }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: Tesis/Codigo/scripts/clusteruy
          file: Tesis/Codigo/scripts/clusteruy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            srobaina99/experiment-cuda:${{ steps.tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image digest
        run: echo "Pushed srobaina99/experiment-cuda:${{ steps.tag.outputs.tag }}"
